<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速查 · tech-notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📟</text></svg>">
<style>
:root {
  --paper: #EEF0EA;
  --surface: #F8F9F5;
  --ink: #1F2622;
  --muted: #5F6B64;
  --rule: #CDD3CB;
  --accent: #2E5E6B;
  --accent-soft: #DCE7E8;
  --warn: #A2521D;
  --warn-soft: #F3E4D8;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", "Menlo", monospace;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171B19;
    --surface: #1F2421;
    --ink: #E3E8E2;
    --muted: #9AA59F;
    --rule: #323A35;
    --accent: #8FC2CC;
    --accent-soft: #24343A;
    --warn: #E19A62;
    --warn-soft: #3A2A1F;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1120px; margin: 0 auto; min-height: 100vh; }

/* 左侧分类 */
.side { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 28px 16px 24px 20px; border-right: 1px solid var(--rule); }
.brand { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.brand strong { color: var(--ink); font-size: 20px; font-family: var(--sans); display: block; letter-spacing: .02em; }
.total { font-size: 13px; color: var(--muted); margin: 0 0 20px; }
.cats { list-style: none; margin: 0; padding: 0; }
.cats button {
  width: 100%; display: flex; justify-content: space-between; gap: 8px;
  border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px;
  padding: 4px 8px; border-radius: 4px; cursor: pointer; text-align: left;
}
.cats button:hover { background: var(--accent-soft); }
.cats button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.cats .n { font-family: var(--mono); font-size: 12px; opacity: .7; }
.cats button.zero { opacity: .35; }
.side .src { font-size: 12px; color: var(--muted); margin-top: 24px; }

/* 搜索 */
.main { padding: 0 28px 80px; min-width: 0; }
.searchbar { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 24px 0 14px; border-bottom: 1px solid var(--rule); }
.prompt { display: flex; align-items: baseline; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.prompt:focus-within { border-color: var(--accent); }
.prompt label { font-family: var(--mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
.prompt input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-family: var(--mono), var(--sans); font-size: 22px; }
.prompt input::placeholder { color: var(--muted); opacity: .6; }
.status { font-size: 13px; color: var(--muted); margin: 8px 2px 0; min-height: 1.6em; }
.status kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }

/* 结果 */
.group { margin-top: 28px; }
.group h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.entry { border-bottom: 1px solid var(--rule); }
.head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0 10px; }
.toggle { flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; }
.cmd { font-family: var(--mono); font-size: 17px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; }
.cmd code { font-size: 1em; color: var(--accent); }
.desc { margin-top: 3px; color: var(--ink); }
.desc code, .more code { background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
.why { margin-top: 2px; font-size: 13px; color: var(--muted); }
.pit { margin: 6px 0 0; padding: 4px 10px; border-left: 3px solid var(--warn); background: var(--warn-soft); font-size: 14px; }
.pit b { color: var(--warn); margin-right: 6px; }
.entry > .pit:last-child { margin-bottom: 12px; }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.copy { border: 1px solid var(--rule); background: var(--surface); color: var(--muted); font: inherit; font-size: 12px; border-radius: 4px; padding: 1px 8px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.more { padding: 0 0 12px; font-size: 14px; color: var(--muted); }
.more dl { display: grid; grid-template-columns: 3em 1fr; gap: 2px 8px; margin: 0; }
.more dt { color: var(--muted); }
.more dd { margin: 0; color: var(--ink); }
.says { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.says span { border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; font-size: 13px; }
.empty { margin-top: 40px; color: var(--muted); }

@media (max-width: 760px) {
  .layout { display: block; }
  .side { position: static; height: auto; border-right: 0; padding: 18px 16px 0; }
  .total { margin-bottom: 10px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
  .cats li { flex-shrink: 0; }
  .cats button { border: 1px solid var(--rule); white-space: nowrap; }
  .side .src { display: none; }
  .main { padding: 0 16px 60px; }
  .searchbar { padding-top: 10px; }
  .prompt label { display: none; }
  .prompt input { font-size: 18px; }
  .head { flex-direction: column; gap: 6px; }
  .meta { flex-direction: row; align-items: center; }
}
@media (prefers-reduced-motion: no-preference) {
  .more { animation: open .15s ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <p class="brand"><strong>速查</strong>tech-notes</p>
    <p class="total" id="total"></p>
    <ul class="cats" id="cats"></ul>
    <p class="src">内容来自 <a href="https://github.com/LuTianming-Timmy-1111/tech-notes">tech-notes</a> 仓库的笔记，<code>python3 tools/build.py</code> 生成。</p>
  </aside>
  <main class="main">
    <div class="searchbar">
      <div class="prompt">
        <label for="q">[root@notes ~]#</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="看最后几行、端口、tail……" autofocus>
      </div>
      <p class="status" id="status"></p>
    </div>
    <div id="results"></div>
  </main>
</div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
// ---- 搜索逻辑（网页里原样使用）----
function stripMd(s) { return (s || "").replace(/`/g, "").replace(/\*\*/g, ""); }

function osa(a, b) {            // 编辑距离，相邻字母互换算 1 步
  const m = a.length, n = b.length;
  const d = [];
  for (let i = 0; i <= m; i++) { d.push(new Array(n + 1).fill(0)); d[i][0] = i; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[m][n];
}

function prepare(notes) {
  return notes.map(function (n, i) {
    const t = stripMd(n.title);
    return Object.assign({}, n, {
      idx: i, t: t, d: stripMd(n.desc),
      tokens: (t.toLowerCase().match(/[a-z][a-z0-9_]*/g) || []).filter(function (w) { return w.length >= 3; }),
    });
  });
}

// 命令名拼错：查询里每个英文词都要在命令里找到足够接近的词
function typoScore(item, words) {
  if (!words.length || !item.tokens.length) return null;
  let total = 0;
  for (const w of words) {
    let best = Infinity;
    for (const tok of item.tokens) {
      if (tok === w) { best = 0; break; }
      if (tok.startsWith(w) && w.length >= 3) { best = Math.min(best, 0.5); continue; }
      const limit = w.length >= 6 ? 2 : 1;
      if (Math.abs(tok.length - w.length) > limit) continue;
      const dist = osa(w, tok);
      if (dist <= limit) best = Math.min(best, dist);
    }
    if (best === Infinity) return null;
    total += best / w.length;
  }
  return 0.05 + total / words.length;
}

function makeSearch(items, Fuse) {
  const fuse = Fuse ? new Fuse(items, {
    keys: [{ name: "t", weight: 3 }, { name: "says", weight: 2 }, { name: "d", weight: 1 }],
    threshold: 0.4, ignoreLocation: true, includeScore: true, includeMatches: true,
  }) : null;

  const FILLER = /怎么|如何|怎样|我要|我想|想要|一下|用什么|什么命令|命令|吗|呢|？|\?/g;

  return function (q) {
    q = q.trim();
    const cleaned = q.replace(FILLER, "").trim();
    if (cleaned) q = cleaned;
    if (!q) return [];
    const scores = new Map();
    const why = new Map();
    if (fuse) {
      for (const r of fuse.search(q)) {
        scores.set(r.item.idx, r.score);
        const m = (r.matches || []).find(function (x) { return x.key === "says"; });
        if (m) why.set(r.item.idx, m.value);
      }
    } else {                      // Fuse 加载失败时退回普通包含匹配
      const ql = q.toLowerCase();
      for (const it of items) {
        if (it.t.toLowerCase().includes(ql)) scores.set(it.idx, 0.1);
        else if (it.says.some(function (s) { return s.includes(q); })) scores.set(it.idx, 0.2);
        else if (it.d.toLowerCase().includes(ql)) scores.set(it.idx, 0.3);
      }
    }
    // 英文查询：命令名里能对上的（含拼错一两个字母）排在最前面
    const typo = new Map();
    const words = (q.toLowerCase().match(/[a-z][a-z0-9_]*/g) || []).filter(function (w) { return w.length >= 3; });
    if (words.length && /^[\x00-\x7f]+$/.test(q)) {
      for (const it of items) {
        const s = typoScore(it, words);
        if (s !== null) typo.set(it.idx, s);
      }
    }
    const rank = function (e) { return typo.has(e[0]) ? typo.get(e[0]) - 10 : e[1]; };
    for (const k of typo.keys()) if (!scores.has(k)) scores.set(k, typo.get(k));
    return Array.from(scores.entries())
      .sort(function (a, b) { return rank(a) - rank(b) || a[0] - b[0]; })
      .map(function (e) { return { item: items[e[0]], score: e[1], why: why.get(e[0]) }; });
  };
}

var REPO = "https://github.com/LuTianming-Timmy-1111/tech-notes/blob/main/";
var items = prepare(window.NOTES || []);
var search = makeSearch(items, window.Fuse || null);
var state = { q: "", cat: null, open: new Set() };

var $q = document.getElementById("q");
var $cats = document.getElementById("cats");
var $results = document.getElementById("results");
var $status = document.getElementById("status");
document.getElementById("total").textContent = items.length + " 条，" + window.CATEGORIES.length + " 类";

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
// 只处理笔记里用到的两种 Markdown：`代码` 和 **加粗**
function md(s) {
  return String(s || "").split("`").map(function (part, i) {
    return i % 2 ? "<code>" + esc(part) + "</code>" : esc(part).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }).join("");
}
function copyText(item) {
  var m = item.title.match(/`([^`]+)`/);
  return m ? m[1] : item.t;
}

function renderCats(counts) {
  var html = '<li><button type="button" data-cat="" aria-pressed="' + (state.cat === null) + '">全部<span class="n">' +
    (state.q ? counts.__all : items.length) + "</span></button></li>";
  window.CATEGORIES.forEach(function (c) {
    var n = counts[c] || 0;
    html += '<li><button type="button" data-cat="' + esc(c) + '" aria-pressed="' + (state.cat === c) + '"' +
      (n ? "" : ' class="zero"') + ">" + esc(c) + '<span class="n">' + n + "</span></button></li>";
  });
  $cats.innerHTML = html;
}

function entryHtml(r) {
  var it = r.item, open = state.open.has(it.idx);
  var h = '<article class="entry"><div class="head">' +
    '<button type="button" class="toggle" data-idx="' + it.idx + '" aria-expanded="' + open + '">' +
    '<div class="cmd">' + md(it.title) + "</div>" +
    '<div class="desc">' + md(it.desc) + "</div>" +
    (r.why ? '<div class="why">匹配说法：' + esc(r.why) + "</div>" : "") +
    "</button>" +
    '<div class="meta">' + (state.q.trim() ? '<span class="tag">' + esc(it.cat) + "</span>" : "") +
    '<button type="button" class="copy" data-copy="' + it.idx + '">复制</button></div></div>';
  if (it.pit) h += '<p class="pit"><b>坑</b>' + md(it.pit) + "</p>";
  if (open) {
    h += '<div class="more"><dl>' +
      "<dt>说法</dt><dd class=\"says\">" + it.says.map(function (s) { return "<span>" + esc(s) + "</span>"; }).join("") + "</dd>" +
      (it.proj ? "<dt>项目</dt><dd>" + md(it.proj) + "</dd>" : "") +
      '<dt>出处</dt><dd><a href="' + REPO + esc(it.file) + '" target="_blank" rel="noopener">' + esc(it.file) + "</a></dd>" +
      "</dl></div>";
  }
  return h + "</article>";
}

function render() {
  var results, counts = { __all: 0 };
  if (state.q.trim()) {
    results = search(state.q);
    results.forEach(function (r) { counts[r.item.cat] = (counts[r.item.cat] || 0) + 1; counts.__all++; });
  } else {
    results = items.map(function (it) { return { item: it }; });
    items.forEach(function (it) { counts[it.cat] = (counts[it.cat] || 0) + 1; });
  }
  renderCats(counts);
  var shown = state.cat ? results.filter(function (r) { return r.item.cat === state.cat; }) : results;

  if (!shown.length) {
    $results.innerHTML = '<p class="empty">' + (state.q.trim()
      ? "没找到。换个说法，或者直接输命令名；也可能这条还没收进笔记。"
      : "这一类还没有条目。") + "</p>";
  } else if (state.q.trim()) {
    $results.innerHTML = '<section class="group">' + shown.map(entryHtml).join("") + "</section>";
  } else {
    var html = "";
    window.CATEGORIES.forEach(function (c) {
      var list = shown.filter(function (r) { return r.item.cat === c; });
      if (list.length) html += '<section class="group"><h2>' + esc(c) + "</h2>" + list.map(entryHtml).join("") + "</section>";
    });
    $results.innerHTML = html;
  }
  $status.innerHTML = state.q.trim()
    ? "找到 " + shown.length + " 条，按匹配程度排序" + (window.Fuse ? "" : "（模糊搜索没加载上，现在是普通包含匹配）")
    : "按 <kbd>/</kbd> 开始搜索，<kbd>Esc</kbd> 清空；点一条看说法和项目";
}

var timer;
$q.addEventListener("input", function () {
  clearTimeout(timer);
  timer = setTimeout(function () { state.q = $q.value; state.open.clear(); render(); window.scrollTo(0, 0); }, 80);
});
$q.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { $q.value = ""; state.q = ""; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "/" && document.activeElement !== $q) { e.preventDefault(); $q.focus(); $q.select(); }
});
$cats.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  state.cat = b.dataset.cat || null; render();
});
$results.addEventListener("click", function (e) {
  var c = e.target.closest(".copy");
  if (c) {
    var it = items[+c.dataset.copy];
    navigator.clipboard.writeText(copyText(it)).then(function () {
      c.textContent = "已复制"; setTimeout(function () { c.textContent = "复制"; }, 1200);
    }, function () { c.textContent = "复制失败"; });
    return;
  }
  var t = e.target.closest(".toggle"); if (!t) return;
  var idx = +t.dataset.idx;
  if (state.open.has(idx)) state.open.delete(idx); else state.open.add(idx);
  render();
  var again = $results.querySelector('.toggle[data-idx="' + idx + '"]');
  if (again) again.focus();
});
render();
</script>
</body>
</html>
